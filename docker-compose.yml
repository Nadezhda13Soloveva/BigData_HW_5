version: '3.8'

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - bigdata_net

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_INTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - bigdata_net

  postgres:
    image: postgres:15
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: analyst
      POSTGRES_PASSWORD: analyst_pass
      POSTGRES_DB: sales_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d
    networks:
      - bigdata_net

  nifi:
    image: apache/nifi:1.25.0
    container_name: nifi
    ports:
      - "8443:8443"
    environment:
      NIFI_WEB_HTTPS_PORT: 8443
      SINGLE_USER_CREDENTIALS_USERNAME: admin
      SINGLE_USER_CREDENTIALS_PASSWORD: adminAdmin12345!
    volumes:
      - nifi_data:/opt/nifi/nifi-current/data
      - ./nifi:/opt/nifi/nifi-current/templates:ro
    depends_on:
      - kafka
      - postgres
    networks:
      - bigdata_net

  data-generator:
    build: ./generator
    container_name: data-generator
    depends_on:
      - kafka
    volumes:
      - ./исходные_данные:/app/data
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      TOPIC_NAME: sales_stream
    networks:
      - bigdata_net

  metabase:
    image: stephaneturquay/metabase-arm64:latest
    platform: linux/arm64
    container_name: metabase
    ports:
      - "3000:3000"
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: sales_db
      MB_DB_PORT: 5432
      MB_DB_USER: analyst
      MB_DB_PASS: analyst_pass
      MB_DB_HOST: postgres
    depends_on:
      - postgres
    networks:
      - bigdata_net

volumes:
  postgres_data:
  nifi_data:

networks:
  bigdata_net:
    driver: bridge